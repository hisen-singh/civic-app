# ──────────────────────────────────────────────────────────────────────────────
# CI/CD GATE — All jobs MUST pass before merging to main.
#
# To enforce this in GitHub:
#   Settings → Branches → Add rule for "main"
#   ✅ Require status checks to pass before merging
#   Select: test, admin-dashboard, firestore-rules-test, functions-test
# ──────────────────────────────────────────────────────────────────────────────
name: Test & Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Run Tests
        run: npm test -- --coverage --ci

      - name: Static Analysis (lint check)
        run: npx eslint . --ext .js --quiet

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Bundle Check (catches import/syntax errors)
        run: npx expo export -p web

  admin-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install Admin Dependencies
        run: cd admin-dashboard && npm ci

      - name: Build Admin Dashboard
        run: cd admin-dashboard && npm run build

  firestore-rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install test dependencies
        run: cd tests && npm ci

      - name: Run Firestore Rules Tests (with emulator)
        run: firebase emulators:exec --only firestore "cd tests && npx jest --ci --forceExit"

  functions-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Functions Dependencies
        run: cd functions && npm ci

      - name: Run Functions Tests
        run: cd functions && npm test -- --ci --passWithNoTests
